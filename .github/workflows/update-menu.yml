name: Update Unicafe menu

on:
  schedule:
    # Times are UTC. Helsinki is UTC+3 in summer time, UTC+2 in winter.
    - cron: "20 3 * * *"      # early morning
    - cron: "20 8 * * 1-6"    # late morning, picks up same-day changes
  workflow_dispatch:           # "Run workflow" button for manual updates

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch menus
        run: python3 update_menu.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add menu
          git commit -m "Update menu $(date -u +%F)" || exit 0
          git push
